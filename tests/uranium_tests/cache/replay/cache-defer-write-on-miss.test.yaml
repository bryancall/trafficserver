# With defer_write_on_miss on, every miss goes to the origin before taking the
# cache write lock. A cacheable response is then stored and the next request
# hits; a no-store response is not stored; a miss that loses the lock after
# its response arrived serves that response uncached instead of the 502 its
# open write fail action asks for on a miss, and the URL is stored by the next
# miss instead. The client's preconditions are not sent to the origin for these
# misses, so they are answered from the origin's response, both for a no-store
# response and for a miss that lost the lock. The sessions run one after
# another.

meta:
  version: "1.0"

urtest:
  description: 'defer_write_on_miss takes the cache write lock after the response headers'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: true
    copy_to_config_dir:
      - 'cache-write-lock-fail-write.conf'
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http_trans|http_cache'
      proxy.config.http.cache.defer_write_on_miss: 1
      proxy.config.http.cache.open_write_fail_action: 1
    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
        plugins:
          - name: header_rewrite.so
            args: ['cache-write-lock-fail-write.conf']
      - from: "http://plain.example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

    # Deferred: the /cacheable miss (the second request is a hit), both
    # /nostore requests, both /lost misses, /lost-inm, and the six
    # precondition requests. /lost-inm and the first /lost miss are denied
    # the lock by the X-Fail-Cache-Write rule.
    metric_checks:
      - metric: proxy.process.http.cache_open_write_deferred
        value: 12
      - metric: proxy.process.http.cache_open_write_fail_count
        value: 2
        delay: 0
      - metric: proxy.process.http.cache_hit_fresh
        value: 2
        delay: 0

    log_validation:
      diags_log:
        contains:
          - expression: "open_write_fail_action 1 does not hold back a cache miss"
            description: "Verify the warning for a global miss fail action under deferral"
      traffic_out:
        contains:
          - expression: "deferring the cache write until the response arrives"
            description: "Verify a miss went to the origin without the write lock"
          - expression: "deferred cache write, response is cacheable"
            description: "Verify the write lock was taken after a cacheable response arrived"
          - expression: "deferred cache write, response is not cacheable"
            description: "Verify no write lock was taken for the no-store response"

sessions:
- transactions:
  - client-request:
      method: GET
      url: /cacheable
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, cacheable-first]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, first]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

  - client-request:
      delay: 500ms
      method: GET
      url: /cacheable
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, cacheable-second]
    server-response:
      status: 400
      reason: Bad Request
      headers:
        fields:
        - [Content-Length, "0"]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

- transactions:
  - client-request:
      method: GET
      url: /nostore
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, nostore-first]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, first]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

  - client-request:
      delay: 500ms
      method: GET
      url: /nostore
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, nostore-second]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, second]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: second, as: equal}]

- transactions:
  - client-request:
      method: GET
      url: /lost
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [X-Fail-Cache-Write, "1"]
        - [uuid, lost-first]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, first]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

  - client-request:
      delay: 500ms
      method: GET
      url: /lost
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, lost-second]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, second]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: second, as: equal}]

  - client-request:
      delay: 500ms
      method: GET
      url: /lost
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, lost-third]
    server-response:
      status: 400
      reason: Bad Request
      headers:
        fields:
        - [Content-Length, "0"]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: second, as: equal}]

# A no-store response to a deferred miss, with each kind of client precondition.
- transactions:
  - client-request:
      delay: 100ms
      method: GET
      url: /pre-inm-match
      version: '1.1'
      headers:
        fields:
        - [Host, plain.example.com]
        - [uuid, pre-inm-match]
        - [If-None-Match, '"v1"']
    proxy-request:
      headers:
        fields:
        - [If-None-Match, {as: absent}]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [ETag, '"v1"']
        - [Last-Modified, "Wed, 01 Jan 2025 00:00:00 GMT"]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 304

  - client-request:
      delay: 100ms
      method: GET
      url: /pre-inm-other
      version: '1.1'
      headers:
        fields:
        - [Host, plain.example.com]
        - [uuid, pre-inm-other]
        - [If-None-Match, '"other"']
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [ETag, '"v1"']
        - [Last-Modified, "Wed, 01 Jan 2025 00:00:00 GMT"]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200

  - client-request:
      delay: 100ms
      method: GET
      url: /pre-ims
      version: '1.1'
      headers:
        fields:
        - [Host, plain.example.com]
        - [uuid, pre-ims]
        - [If-Modified-Since, 'Thu, 01 May 2025 00:00:00 GMT']
    proxy-request:
      headers:
        fields:
        - [If-Modified-Since, {as: absent}]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [ETag, '"v1"']
        - [Last-Modified, "Wed, 01 Jan 2025 00:00:00 GMT"]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 304

  - client-request:
      delay: 100ms
      method: GET
      url: /pre-if-match
      version: '1.1'
      headers:
        fields:
        - [Host, plain.example.com]
        - [uuid, pre-if-match]
        - [If-Match, '"other"']
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [ETag, '"v1"']
        - [Last-Modified, "Wed, 01 Jan 2025 00:00:00 GMT"]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 412

  - client-request:
      delay: 100ms
      method: GET
      url: /pre-ius
      version: '1.1'
      headers:
        fields:
        - [Host, plain.example.com]
        - [uuid, pre-ius]
        - [If-Unmodified-Since, 'Tue, 01 Oct 2024 00:00:00 GMT']
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [ETag, '"v1"']
        - [Last-Modified, "Wed, 01 Jan 2025 00:00:00 GMT"]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 412

  - client-request:
      delay: 100ms
      method: GET
      url: /pre-404
      version: '1.1'
      headers:
        fields:
        - [Host, plain.example.com]
        - [uuid, pre-404]
        - [If-None-Match, '"v1"']
    server-response:
      status: 404
      reason: Not Found
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [ETag, '"v1"']
        - [Last-Modified, "Wed, 01 Jan 2025 00:00:00 GMT"]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 404

# A cacheable response to a deferred miss that is denied the late write lock.
- transactions:
  - client-request:
      method: GET
      url: /lost-inm
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [X-Fail-Cache-Write, "1"]
        - [If-None-Match, '"v1"']
        - [uuid, lost-inm]
    proxy-request:
      headers:
        fields:
        - [If-None-Match, {as: absent}]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [ETag, '"v1"']
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 304
