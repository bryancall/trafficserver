        - [X-Response, first]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

  - client-request:
      delay: 500ms
      method: GET
      url: /read-retries
      version: '1.1'
      headers:
        fields:
        - [Host, read-retries.example.com]
        - [uuid, read-retries-second]
    server-response:
