# defer_write_on_miss is on unless configured off. With nothing set, a miss
# goes to the origin before taking the cache write lock, a cacheable response
# is still stored and served from cache, and a no-store response is not.

meta:
  version: "1.0"

urtest:
  description: 'defer_write_on_miss is on by default'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http_trans|http_cache'
    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

    # Deferred: the /cacheable miss and both /nostore requests. The second
    # /cacheable request is a hit.
    metric_checks:
      - metric: proxy.process.http.cache_open_write_deferred
        value: 3
      - metric: proxy.process.http.cache_open_write_fail_count
        value: 0
        delay: 0
      - metric: proxy.process.http.cache_hit_fresh
        value: 1
        delay: 0

sessions:
- transactions:
  - client-request:
      method: GET
      url: /cacheable
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, cacheable-first]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, first]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

  - client-request:
      delay: 500ms
      method: GET
      url: /cacheable
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, cacheable-second]
    server-response:
      status: 400
      reason: Bad Request
      headers:
        fields:
        - [Content-Length, "0"]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

- transactions:
  - client-request:
      method: GET
      url: /nostore
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, nostore-first]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, first]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

  - client-request:
      delay: 500ms
      method: GET
      url: /nostore
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, nostore-second]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, second]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: second, as: equal}]
